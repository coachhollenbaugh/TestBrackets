
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <meta http-equiv="refresh" content="30">
                <style>
                    body { background: #0f1418; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                    .title-bar { padding: 10px 25px; background: #1e272e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d4e5d; flex-shrink: 0; }
                    .bracket-header-row { display: flex; flex-direction: row; gap: 60px; padding: 15px 20px 5px 20px; flex-shrink: 0; }
                    .header-cell { min-width: 220px; text-align: center; color: #f1c40f; font-weight: bold; font-size: 1.1em; }
                    
                    .bracket-body { display: flex; flex-direction: row; gap: 60px; padding: 0 20px 20px 20px; flex-grow: 1; align-items: stretch; overflow-x: auto; overflow-y: hidden; }
                    .round-col { display: flex; flex-direction: column; justify-content: space-around; min-width: 220px; height: 100%; position: relative; }
                    .round-12 { justify-content: center !important; gap: 80px; }

                    .match-card { 
                        background: #1e272e; border: 1px solid #3d4e5d; border-radius: 4px; 
                        padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); position: relative; 
                        z-index: 2;
                    }
                    
                    /* Connector Hook Logic (Only for standard brackets) */
                    
                    .match-card::after {
                        content: ""; position: absolute; right: -31px; top: 50%;
                        width: 30px; height: 2px; background: #3d4e5d;
                    }
                    .match-card:nth-child(odd)::before {
                        content: ""; position: absolute; right: -31px; top: 50%;
                        width: 2px; height: 100%; background: #3d4e5d;
                    }
                    

                    .no-line::after, .no-line::before { display: none !important; }

                    .match-title { position: absolute; top: -20px; left: 0; width: 100%; text-align: center; font-size: 0.75em; color: #f1c40f; font-weight: bold; text-transform: uppercase; }
                    .bout-num { font-size: 0.75em; color: #f1c40f; margin-bottom: 4px; font-weight: bold; }
                    .source-tag { font-size: 0.8em; color: #e74c3c; font-weight: bold; margin-right: 5px; }
                    .player { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.95em; }
                    .winner { color: #2ecc71; font-weight: bold; }
                    .score { background: #000; padding: 0 6px; border-radius: 3px; min-width: 18px; text-align: center; }
                    .matlogic-text { color: #2ecc71; font-weight: bold; font-size: 0.85em; }
                </style>
            </head>
