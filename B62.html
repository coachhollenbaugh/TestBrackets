
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="30">
            <style>
                body { 
                    background: #0f1418; color: white; font-family: 'Segoe UI', sans-serif; 
                    margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
                }
                
                /* Fixed Top Header Row */
                .bracket-header-row {
                    display: flex; flex-direction: row; gap: 30px; padding: 20px 20px 0 20px;
                    background: #0f1418; border-bottom: 2px solid #2c3e50;
                }
                .header-cell {
                    min-width: 220px; text-align: center; color: #f1c40f; 
                    font-weight: bold; font-size: 1.2em; padding-bottom: 10px;
                }

                /* Main Scrollable Bracket Area */
                .bracket-body { 
                    display: flex; flex-direction: row; gap: 30px; padding: 0 20px;
                    flex-grow: 1; align-items: stretch;
                }

                /* Vertical Centering Logic */
                .round-col { 
                    display: flex; flex-direction: column; 
                    justify-content: space-around; /* This centers bouts vertically */
                    min-width: 220px; height: 100%;
                }

                .match-card { 
                    background: #1e272e; border: 1px solid #3d4e5d; border-radius: 4px; 
                    padding: 10px; margin: 5px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                }

                .bout-num { font-size: 0.75em; color: #f1c40f; margin-bottom: 6px; }
                .player { display: flex; justify-content: space-between; padding: 4px 0; font-size: 1em; }
                .winner { color: #2ecc71; font-weight: bold; text-transform: uppercase; }
                .bye { color: #576574; font-style: italic; }
                .score { background: #000; padding: 0 6px; border-radius: 3px; min-width: 20px; text-align: center; }
                
                .title-bar { padding: 15px 25px; background: #1e272e; display: flex; justify-content: space-between; align-items: center; }
                .back-btn { color: #3498db; text-decoration: none; font-weight: bold; }
            </style>
        </head>
